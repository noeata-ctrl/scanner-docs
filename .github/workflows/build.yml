name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk ScannerDocs.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ScannerDocs-apk
          path: ScannerDocs.apk

      - name: Publicar para download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ScannerDocs.apk \
            --title "Scanner Docs (versão ${{ github.run_number }})" \
            --notes "Abra esta página no celular, toque em **ScannerDocs.apk** para baixar e depois abra o arquivo para instalar."
